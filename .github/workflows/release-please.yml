name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  packages: write
  # Necesario para que el job `publish` pueda LEER el estado de la corrida de CI
  # de este commit (scripts/wait-for-ci.sh). OJO: al declarar un bloque
  # `permissions:` explicito, todo scope no listado queda en `none` — sin esta
  # linea, `gh api .../actions/runs` devuelve 403 y la espera fallaria siempre
  # (fail-closed: no publicaria, pero por el motivo equivocado).
  actions: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # `!cancelled()` para que el publish corra aunque el job release-please termine
    # en fallo DESPUÉS de haber creado el release. La action a veces tira un error
    # secundario post-tag (p.ej. "Backfilling file list… release-please failed:")
    # que hace fallar el job pero deja el tag + el output release_created ya seteados;
    # con el gate original (`success()` implícito) el publish se saltea y el artefacto
    # nunca llega a Packages — fue exactamente lo que pasó con v1.8.0 (run 30019140010).
    # El segundo clause sigue publicando SOLO cuando de verdad se creó un release.
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    # macOS desde WA-3.1, y es obligatorio, no una preferencia.
    #
    # Hasta 1.8.1 esto corria en ubuntu y publicaba bien: Kotlin/Native compila
    # klibs de iOS en Linux sin problema (el toolchain de Apple hace falta para
    # LINKEAR y para correr tests, no para producir un .klib desde fuentes Kotlin).
    #
    # cinterop rompe esa propiedad. cinteropWatermelonAudio<Target> necesita el SDK
    # de iOS para parsear watermelon_audio.h, y el .a que embebe solo lo produce
    # Xcode via scripts/build-ios.sh. En Linux no hay forma.
    #
    # Cuesta ~10x el minutaje de ubuntu. Se paga entero porque la alternativa
    # (matriz host-specific, ubuntu publicando Android+metadata y macOS los klibs)
    # parte la publicacion en dos jobs que pueden divergir de version — justo el
    # modo de falla que ya nos mordio con 1.8.0.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # Hasta el 2026-07-29 este job corria en PARALELO con el CI sobre el mismo
      # push, sin depender de él: "el CI paga su costo antes de un release" era
      # una coincidencia temporal, no una garantia. Un CI rojo —o un flake de red
      # como el handshake de CMake que se vio ese dia— no impedia publicar.
      #
      # Ahora el publish ESPERA a que el CI de este commit termine verde. En
      # master el CI no honra atestaciones (evento push), asi que ese verde son
      # los 7 jobs corridos de verdad. Fail-closed: si el CI no cierra verde a
      # tiempo, este paso falla y el artefacto no se publica — no publicar es el
      # default seguro, se re-dispara. `github.sha` es el commit del push, que es
      # el que el tag apunta y sobre el que corrio el CI.
      - name: Esperar a que el CI de este commit esté verde
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/wait-for-ci.sh "${{ github.sha }}"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}

      - name: Verify tag matches Gradle version
        run: |
          GRADLE_VERSION="$(grep '^version=' gradle.properties | cut -d= -f2-)"
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"
          if [ "$GRADLE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match gradle.properties version ($GRADLE_VERSION)." >&2
            exit 1
          fi

      # cmake/ninja de sistema para el build iOS (scripts/build-ios.sh). NO es el
      # "cmake;3.22.1" que se instala en el Android SDK mas abajo: ese no esta en
      # PATH y es para AGP. Mismo patron que el job `ios` de ci.yml.
      - name: Install C++ build tools
        run: |
          for tool in cmake ninja; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool already present: $(command -v "$tool")"
            else
              brew install "$tool"
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Necesario aunque el foco sea iOS: el modulo aplica com.android.library, asi
      # que sin SDK Gradle ni configura el proyecto.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager --install \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      # ~1 GB por corrida sin cache.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release
        run: ./gradlew :audio:assembleRelease

      - name: Publish to GitHub Packages
        run: ./gradlew :audio:publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
