name: Release Please

# 🔴 DISPARO MANUAL, y es deliberado (2026-08-25).
#
# Hasta hoy esto corria en `push: master`, asi que cada merge —incluido un `fix:`
# de una linea— abria o actualizaba un PR de release. El resultado no era "mas
# releases", era RUIDO: PRs de release que nadie pidio, con su CI entero corriendo
# encima, y version nueva por cada cambio patch. El PR #200 (`chore: release
# 2.10.0`) aparecio solo al mergear #199 y quedo rojo en `check-time-dependence`,
# bloqueando algo que nadie habia decidido soltar.
#
# Ahora el release lo decide una persona: se dispara este workflow cuando se quiere
# CORTAR una version. release-please sigue leyendo los conventional commits
# acumulados desde el ultimo tag, asi que no se pierde nada del changelog — solo se
# elige CUANDO mirarlo.
#
# Y publicar es un segundo gesto aparte: ver la nota del job `publish`, mas abajo.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Sin `outputs:`. Los tenia —`release_created`, `tag_name`— para el job
    # `publish` que vivia aca abajo; sin ese job no los lee nadie, y un output que
    # nadie consume es la clase de superficie que este repo ya saco otras veces.
    # Si algun dia se encadena algo, vuelven junto con su consumidor.
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

# ======================================================================
# EL JOB `publish` YA NO VIVE ACA (2026-08-25)
# ======================================================================
#
# Antes, mergear el PR de release publicaba a GitHub Packages en el mismo tiron.
# Ahora publicar es un gesto propio: `.github/workflows/publish.yml`, disparado a
# mano sobre el tag.
#
# 🔴 LO QUE HABIA QUE NO PERDER. Ese job era el UNICO que esperaba a que el CI del
# commit estuviera verde antes de publicar (`scripts/wait-for-ci.sh`), y esa espera
# es fail-closed: si el CI no cierra verde, no se publica. `publish.yml` NO esperaba
# a proposito, porque era el override de emergencia con el que se rescato v1.8.0.
#
# Al mover la publicacion alla, esa garantia se habria perdido en silencio. Por eso
# `publish.yml` ahora TAMBIEN espera al CI por defecto, con un input explicito para
# saltearla cuando de verdad haga falta un rescate. El default es el seguro; el
# atajo hay que pedirlo.
