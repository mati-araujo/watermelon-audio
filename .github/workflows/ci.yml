name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast host C++ unit tests (dsp + effects + looper + usb) via googletest.
  # No Android SDK / NDK / device needed — pure x86_64. Single configure +
  # build + ctest pass driven by scripts/run-cpp-tests.sh.
  cpp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++

      - name: Build & run C++ test suite
        run: bash scripts/run-cpp-tests.sh

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager --install \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Kotlin unit tests (commonTest)
        run: ./gradlew :audio:testDebugUnitTest

      - name: Build debug
        run: ./gradlew :audio:assembleDebug

      - name: Build release
        run: ./gradlew :audio:assembleRelease
