name: CI

on:
  # NO usar `paths-ignore` acá. Lo tuvo entre el 2026-07-28 y el 2026-07-29, y es
  # incompatible con marcar estos checks como *required*: un workflow salteado por
  # filtro de paths NUNCA reporta, el check queda `pending` para siempre y el PR
  # no se puede mergear jamás. El ahorro para PRs de prosa ahora lo da el job
  # `changes` de abajo, que sí reporta.
  pull_request:
    branches: [master]

  # Correr en master NO es redundante con el PR, y arregla dos cosas distintas.
  #
  # 1. ES EL UNICO ESCRITOR DE LA CACHE DE GRADLE. `gradle/actions/setup-gradle`
  #    escribe la cache SOLO desde la rama por defecto; en un PR se pone en
  #    `cache-read-only: true` (esta en el log del job). Como hasta acá el CI
  #    corria unicamente `on: pull_request`, el unico escritor era el workflow de
  #    publish — la clave que se restauraba era `...publish[...]-d0aa525`, o sea
  #    el release 1.11.0. La cache estaba tan fresca como el ultimo release.
  #
  #    Esto es lo que hace rendir el `libtool -D` de scripts/build-ios.sh: sin un
  #    .a reproducible la cache igual fallaba siempre, y sin un escritor no hay
  #    cache que acertar.
  #
  # 2. Hasta acá NADA validaba master. El squash produce un commit que ningun
  #    job vio: el CI corre sobre el head del PR, no sobre el resultado del
  #    merge. Con esto, master queda verificado despues de cada merge.
  #
  # El costo es una corrida extra por merge, ~20 min de macOS. No bloquea a
  # nadie (corre despues del merge) y compra las dos cosas de arriba.
  push:
    branches: [master]

  workflow_dispatch:

# El grupo deriva del SHA en `push` y del ref en todo lo demas. NO simplificar a
# `ci-${{ github.ref }}`: esa forma parece mas limpia y reintroduce un agujero
# medido.
#
# Con el ref, TODOS los commits de master caen en el mismo grupo, asi que cada
# merge cancela el CI del merge anterior. Medido sobre las 19 corridas
# `push: master` del regimen de PRs (2026-07-28 21:58 → 2026-07-29 23:11):
# 4 canceladas, 21%, y el job `ios` fue la victima en las 4 — es el mas largo
# (8m44s-18m15s), asi que siempre es el que queda expuesto.
#
# Hasta el esquema local-first eso costaba poco: la corrida del PR ya habia
# ejecutado ios/build/cpp-tests-macos de verdad, y perder la de master costaba
# solo verificar el resultado del squash. Desde que el PR los saltea por
# atestacion, el push a master es el UNICO lugar del CI donde esos tres gates se
# ejecutan. Cancelarlo deja el contenido sin ninguna corrida de CI. Una config
# vieja e inofensiva paso a ser load-bearing el dia que aterrizo el camino
# rapido; lo encontro el soak, no el diseño.
#
# Y muerde el release: release-please tagea y crea el Release, y DESPUES el
# publish espera al CI (wait-for-ci.sh). Si un merge entra durante esos ~18 min,
# el CI del commit de release se cancela, la espera sale 1 (fail-closed, bien) y
# queda tag + Release publicados con CERO artefacto en Packages — el modo de
# falla exacto de v1.8.0. Con 1.14.0 no paso por 26 min de margen, no por diseño.
#
# `cancel-in-progress: false` NO alcanza como arreglo, y es contraintuitivo: lo
# que hace es que el run en curso sobreviva, pero GitHub CANCELA el run pending
# anterior cuando llega uno nuevo del mismo grupo. O sea, un commit intermedio
# puede no correr nunca, y el run del commit de release puede morir mientras
# espera. Un grupo por SHA es lo unico que garantiza que cada commit de master
# corra entero.
#
# En `pull_request` el grupo sigue siendo el ref, que es lo que se quiere
# conservar: un push nuevo al PR debe matar el run viejo.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # ¿El cambio toca algo que se compile? Es el reemplazo de `paths-ignore`, y la
  # diferencia que importa es que ESTE JOB SÍ CORRE SIEMPRE: los cinco de abajo se
  # saltean por `if:`, y un job salteado reporta conclusión `skipped`, que la
  # protección de rama acepta. Un workflow salteado por filtro de paths, en
  # cambio, no reporta nada y deja el check colgado para siempre.
  #
  # El ahorro es el mismo que antes —un PR de prosa no gasta un minuto de macOS—
  # a cambio de un job de ubuntu de ~15 s.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # peor medido: 0.1 min
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        name: ¿Hay archivos que no sean prosa?
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Ante cualquier duda sobre el rango —primer push a una rama, historia
          # incompleta, base desaparecida— se corre TODO. El default seguro es
          # gastar de más, nunca saltear un gate.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "base $BASE inalcanzable — se corre el gate completo"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "--- archivos cambiados ---"
          echo "$CHANGED"

          if [ -z "$CHANGED" ]; then
            echo "sin cambios: no hay nada que compilar"
            echo "code=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `grep -v` acá contesta "¿hay ALGUNA línea que NO sea prosa?". Con que
          # haya una, corre todo — igual que el `paths-ignore` de antes, que sólo
          # salteaba si TODOS los archivos macheaban.
          if printf '%s\n' "$CHANGED" | grep -qvE '(\.md$|^docs/|^\.gitignore$|^LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "sólo prosa: se saltean los cinco jobs de build"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Fast host C++ unit tests (dsp + effects + looper + usb) via googletest.
  # No Android SDK / NDK / device needed — pure x86_64. Single configure +
  # build + ctest pass driven by scripts/run-cpp-tests.sh.
  cpp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # peor medido: 13.4 min
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7

      # WA-0.4 — pure grep, no toolchain. Runs here rather than in the `ios`
      # job on purpose: macOS minutes cost 10x, and a forbidden include is just
      # as red when Linux says so.
      - name: Portability guardrail (WA-0.4)
        run: bash scripts/check-cpp-portability.sh

      # WD-1.1 — mismo criterio que el de portabilidad: python3 y nada mas, y
      # una violacion de RT-safety es igual de roja dicha por Linux. El
      # --self-test va primero: si el parser del lint se rompe, el lint queda en
      # verde permanente y deja de proteger nada.
      - name: RT-safety guardrail — self-test (WD-1.1)
        run: python3 scripts/check-rt-safety.py --self-test

      - name: RT-safety guardrail (WD-1.1)
        run: python3 scripts/check-rt-safety.py

      # El verificador de atestaciones, contra arboles mutados. Corre ACA —en el
      # unico job que nunca se atesta— por dos razones: no necesita toolchain
      # (git y python3 y nada mas, ~10 s), y si viviera en un job atestable se
      # saltearia justo cuando la atestacion es valida, o sea siempre que el
      # camino rapido esta activo.
      #
      # Lo que cubre no lo cubre nada mas: que un refactor futuro convierta
      # verify-attestation.sh en un pasa-todo. El experimento manual de #94
      # probo el cableado UNA VEZ; esto es lo que sigue vivo despues.
      - name: El verificador de atestaciones no da falsos verdes
        run: bash scripts/test-attestation.sh

      # Instala SOLO lo que falte. La imagen de ubuntu-latest ya trae varias de
      # estas herramientas, y `apt-get update` es la linea mas fragil de todo el
      # CI: si no hace falta, no se corre.
      #
      # Y SIN REINTENTOS, a proposito. Los tenia (`Acquire::Retries=3`) y fueron
      # CONTRAPRODUCENTES: la mirrorlist del runner lista azure.archive.ubuntu.com
      # primero y archive.ubuntu.com como respaldo. Cuando el de Azure se cae,
      # cada reintento retrasa llegar al respaldo que SI funciona — medido el
      # 18/08, cuatro repos x cuatro intentos x 30 s de timeout se comieron los
      # 10 minutos del paso y lo mataron. Fallar rapido hacia el respaldo es
      # exactamente lo que hay que hacer con un mirror muerto.
      - name: Install build tools
        timeout-minutes: 10
        run: |
          need=""
          command -v cmake >/dev/null 2>&1 || need="$need cmake"
          command -v ninja >/dev/null 2>&1 || need="$need ninja-build"
          command -v g++   >/dev/null 2>&1 || need="$need g++"
          if [ -z "$need" ]; then
            echo "cmake/ninja/g++ ya vienen en la imagen — nada que instalar"
            cmake --version | head -1; ninja --version; g++ --version | head -1
            exit 0
          fi
          echo "falta instalar:$need"
          sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 update
          sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 \
            install -y $need

      - name: Build & run C++ test suite
        run: bash scripts/run-cpp-tests.sh

      # ---------------------------------------------------------------------
      # REQ-002 · S4 — la clase se ejercita ANTES del merge, y aca.
      #
      # Los tres jobs que la atestacion local hace saltear en el PR (`ios`,
      # `build`, `cpp-tests-macos`) solo corren enteros en `push: master`. Por eso
      # los tests que sincronizan con el reloj de pared tumbaron master tres veces
      # el 2026-08-20 sin que ningun PR se enterara: eran invisibles antes del
      # merge POR CONSTRUCCION.
      #
      # Este job (`cpp-tests`) NUNCA se saltea y ya tiene la suite construida, asi
      # que cerrar el agujero cuesta una corrida extra y ningun build.
      #
      # OJO CON LO QUE NO HACE: no carga la maquina. Se midio en S1 que la
      # contencion NO reproduce esta clase —40 quemadores sobre 10 nucleos dieron
      # 0/10— porque un `sleep_for(120ms)` es tiempo ABSOLUTO y ahogar la maquina
      # no achica esa ventana. Lo que reproduce es COLAPSARLA: 10/10 en 2 segundos.
      # ---------------------------------------------------------------------
      - name: Ningun test depende del reloj de pared — REQ-002
        run: bash scripts/check-time-dependence.sh

      - name: Toda espera cruda en un test esta clasificada — self-test
        run: python3 scripts/check-test-waits.py --self-test

      - name: Toda espera cruda en un test esta clasificada
        run: python3 scripts/check-test-waits.py

      - name: Ningun subsistema se prepara con un rate literal — self-test
        run: python3 scripts/check-literal-rate.py --self-test

      - name: Ningun subsistema se prepara con un rate literal — REQ-006.4
        run: python3 scripts/check-literal-rate.py

      # REQ-013 — un mecanismo que solo llaman los tests no esta entregado.
      # Va en ESTE job y no en `build` a proposito: `cpp-tests` (ubuntu) nunca
      # se saltea por atestacion, y el lint no necesita toolchain (python3 y
      # nada mas, ~1,2 s). El --self-test primero, misma razon que los de
      # arriba.
      - name: Ningun mecanismo de produccion lo llaman solo los tests — self-test
        run: python3 scripts/check-mechanism-callers.py --self-test

      - name: Ningun mecanismo de produccion lo llaman solo los tests — REQ-013
        run: python3 scripts/check-mechanism-callers.py

      # REQ-025 — la FIRMA de cada cruce JNI, de los dos lados. check-jni-symbols
      # compara solo NOMBRES: un `Int` declarado donde el C++ espera `jlong`
      # compila, linkea, pasa ese gate y corrompe memoria en el device. Va aca
      # (ubuntu, que nunca se saltea por atestacion) y es source-only: no necesita
      # .so ni NDK. El --self-test primero, misma razon que los de arriba.
      - name: Las firmas del cruce JNI coinciden — self-test
        run: python3 scripts/check-jni-signatures.py --self-test

      - name: Las firmas del cruce JNI coinciden — REQ-025
        run: python3 scripts/check-jni-signatures.py

      # REQ-021 — los conteos de CLAUDE.md, re-medidos del arbol. Quedaron stale
      # SIETE tandas seguidas mientras la regla vivia solo en prosa. El
      # --self-test primero, misma razon que los de arriba: si el parser se
      # rompe, el lint queda verde para siempre.
      - name: Los conteos de CLAUDE.md coinciden con el arbol — self-test
        run: python3 scripts/check-doc-counts.py --self-test

      - name: Los conteos de CLAUDE.md coinciden con el arbol — REQ-021
        run: python3 scripts/check-doc-counts.py

  # Same suite under AddressSanitizer + UndefinedBehaviorSanitizer. Catches
  # heap/stack overflows, use-after-free and UB in the lock-free rings and the
  # teardown path — the highest-risk code as the driver plan gains new logic.
  cpp-tests-asan:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # peor medido: 6.6 min
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      # Instala SOLO lo que falte. La imagen de ubuntu-latest ya trae varias de
      # estas herramientas, y `apt-get update` es la linea mas fragil de todo el
      # CI: si no hace falta, no se corre.
      #
      # Y SIN REINTENTOS, a proposito. Los tenia (`Acquire::Retries=3`) y fueron
      # CONTRAPRODUCENTES: la mirrorlist del runner lista azure.archive.ubuntu.com
      # primero y archive.ubuntu.com como respaldo. Cuando el de Azure se cae,
      # cada reintento retrasa llegar al respaldo que SI funciona — medido el
      # 18/08, cuatro repos x cuatro intentos x 30 s de timeout se comieron los
      # 10 minutos del paso y lo mataron. Fallar rapido hacia el respaldo es
      # exactamente lo que hay que hacer con un mirror muerto.
      - name: Install build tools
        timeout-minutes: 10
        run: |
          need=""
          command -v cmake >/dev/null 2>&1 || need="$need cmake"
          command -v ninja >/dev/null 2>&1 || need="$need ninja-build"
          command -v g++   >/dev/null 2>&1 || need="$need g++"
          if [ -z "$need" ]; then
            echo "cmake/ninja/g++ ya vienen en la imagen — nada que instalar"
            cmake --version | head -1; ninja --version; g++ --version | head -1
            exit 0
          fi
          echo "falta instalar:$need"
          sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 update
          sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 \
            install -y $need
      - name: Build & run C++ test suite (ASan+UBSan)
        env:
          SANITIZE: address,undefined
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: bash scripts/run-cpp-tests.sh

  # Same suite under ThreadSanitizer. The SPSC rings and the DSP↔USB↔event
  # handoff are the #1 candidates for latent data races.
  cpp-tests-tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # peor medido: 10.6 min
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      # Instala SOLO lo que falte. La imagen de ubuntu-latest ya trae varias de
      # estas herramientas, y `apt-get update` es la linea mas fragil de todo el
      # CI: si no hace falta, no se corre.
      #
      # Y SIN REINTENTOS, a proposito. Los tenia (`Acquire::Retries=3`) y fueron
      # CONTRAPRODUCENTES: la mirrorlist del runner lista azure.archive.ubuntu.com
      # primero y archive.ubuntu.com como respaldo. Cuando el de Azure se cae,
      # cada reintento retrasa llegar al respaldo que SI funciona — medido el
      # 18/08, cuatro repos x cuatro intentos x 30 s de timeout se comieron los
      # 10 minutos del paso y lo mataron. Fallar rapido hacia el respaldo es
      # exactamente lo que hay que hacer con un mirror muerto.
      - name: Install build tools
        timeout-minutes: 10
        run: |
          need=""
          command -v cmake >/dev/null 2>&1 || need="$need cmake"
          command -v ninja >/dev/null 2>&1 || need="$need ninja-build"
          command -v g++   >/dev/null 2>&1 || need="$need g++"
          if [ -z "$need" ]; then
            echo "cmake/ninja/g++ ya vienen en la imagen — nada que instalar"
            cmake --version | head -1; ninja --version; g++ --version | head -1
            exit 0
          fi
          echo "falta instalar:$need"
          sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 update
          sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 \
            install -y $need
      - name: Build & run C++ test suite (TSan)
        env:
          SANITIZE: thread
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: bash scripts/run-cpp-tests.sh

  # WA-T.1 — la suite C++ bajo Apple clang, en un runner PARA ELLA SOLA.
  #
  # Vivio adentro del job `ios` hasta el 2026-07-29 y salio de ahi por una razon
  # medida, no por prolijidad: el job `ios` bootea un simulador en su segundo
  # paso, y arrancar un simulador en un runner de 3 nucleos es una tormenta de
  # spawns que le cobra ~1.5s de trabajo ajeno por cada segundo que se ahorra.
  #
  # Lo mas facil de ver es el `Configuring done (Ns)` que imprime el propio CMake,
  # misma imagen de runner (macos-26-arm64 20260720.0258.1) a los dos lados:
  #
  #   sin simulador booteando al lado (3 corridas)    5.8s   7.9s   9.5s
  #   con simulador booteando al lado (8 corridas)  119.4s ...  222.6s
  #
  # El paso entero: 328s dentro del job `ios`, ~117s sin el simulador al lado.
  #
  # Mover el boot NO lo arregla — se probo y esta medido en el PR #88: puesto al
  # lado del XCFramework, ESE paso se fue de 105s a 359s; puesto en serie al
  # final, el harness se fue de 127s a 325s porque un simulador recien booteado
  # todavia esta acomodandose cuando `bootstatus` ya volvio. La tormenta cae sobre
  # lo que tenga al lado; la unica salida es no tener nada al lado.
  #
  # Por eso este job existe: aca la suite corre en un runner limpio Y sale del
  # camino critico, mientras el job `ios` conserva lo que le conviene — bootear
  # primero, para que el simulador llegue asentado al harness.
  #
  # Lo que este job afirma y ningun otro puede: los tests bajo Apple clang +
  # libc++. Los jobs de ubuntu corren los mismos 779 con g++ + libstdc++, y el
  # gate de warnings de ios/CMakeLists.txt cubre los diagnosticos del motor pero
  # NO ejecuta nada ni ve los ~78 archivos de test, usb/ ni PlatformAndroid.cpp.
  #
  # No lleva el guardrail de portabilidad (WA-0.4): ya corre en `cpp-tests`, sobre
  # ubuntu, y un include prohibido es igual de rojo dicho por Linux.
  cpp-tests-macos:
    runs-on: macos-latest
    timeout-minutes: 20  # peor medido: 4.3 min
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7

      # ¿Ya corrió el gate local sobre este contenido exacto? Si sí, los
      # pasos de abajo se saltean y este job termina en verde en segundos.
      # Ante CUALQUIER duda el script emite valid=false y el gate corre
      # entero: es un camino rápido, no una excepción. Ver
      # docs/ci/local_first.md y scripts/verify-attestation.sh.
      - id: attest
        name: Verificar la atestación local
        run: bash scripts/verify-attestation.sh cpp-tests-macos

      # La imagen normalmente trae los dos; se instala solo lo que falte, para que
      # un cambio de imagen no rompa el job y una corrida normal cueste ~0s.
      # Necesita un cmake de sistema: el "cmake;3.22.1" del SDK de Android no esta
      # en PATH y es para AGP.
      - name: Install C++ build tools
        if: steps.attest.outputs.valid != 'true'
        run: |
          for tool in cmake ninja; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool already present: $(command -v "$tool")"
            else
              echo "Installing $tool ..."
              brew install "$tool"
            fi
          done

      - name: Build & run C++ test suite (Apple clang) — WA-T.1
        if: steps.attest.outputs.valid != 'true'
        run: bash scripts/run-cpp-tests.sh

  # WA-0.3 — macOS / iOS job.
  #
  # Lo que ningun otro job puede cazar:
  #   1. Que commonMain siga compilando para Kotlin/Native. En todos los demas
  #      lados commonMain se type-checkea solo contra el classpath de la JVM, que
  #      es exactamente como acumulo 34 referencias JVM-only antes de WA-0.2
  #      (String.format, System.currentTimeMillis, @Volatile, java.* reflection).
  #      Sin este job esa deuda vuelve derecho.
  #   2. Que el motor cross-compile para iOS (build-ios.sh), que el XCFramework
  #      TRAIGA el motor adentro, y que la app del harness ARRANQUE sin morirse.
  #
  # La suite C++ bajo Apple clang salio de aca al job `cpp-tests-macos`; el porque
  # esta en el comentario de ese job y no es una mudanza cosmetica.
  #
  # Must stay on an arm64 runner: iosSimulatorArm64 tests cannot execute on x86.
  ios:
    runs-on: macos-latest
    timeout-minutes: 40  # peor medido: 16.6 min
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v7

      # ¿Ya corrió el gate local sobre este contenido exacto? Si sí, los
      # pasos de abajo se saltean y este job termina en verde en segundos.
      # Ante CUALQUIER duda el script emite valid=false y el gate corre
      # entero: es un camino rápido, no una excepción. Ver
      # docs/ci/local_first.md y scripts/verify-attestation.sh.
      - id: attest
        name: Verificar la atestación local
        run: bash scripts/verify-attestation.sh ios

      # El boot del simulador tarda ~3m30s y NO depende de nada de lo que sigue,
      # asi que se dispara primero y se espera recien al final (paso "Wait for
      # the simulator"). Antes era un paso bloqueante justo antes del harness y
      # esos 3m30s se sumaban enteros al job.
      #
      # `simctl boot` vuelve enseguida —el arranque sigue de fondo— y el UDID se
      # publica en el env para el paso que espera. Si no hubiera ningun iPhone
      # disponible, esto falla ACA y no veinte minutos despues.
      - name: Start booting a simulator — WA-5.5
        if: steps.attest.outputs.valid != 'true'
        run: |
          UDID="$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for v in d.values() for x in v if "iPhone" in x["name"]))')"
          xcrun simctl boot "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      # Sigue haciendo falta para build-ios.sh, que es el primer paso pesado del
      # job ahora que la suite se mudo. La imagen normalmente trae los dos; se
      # instala solo lo que falte. Necesita un cmake de sistema: el
      # "cmake;3.22.1" del SDK de Android no esta en PATH y es para AGP.
      - name: Install C++ build tools
        if: steps.attest.outputs.valid != 'true'
        run: |
          for tool in cmake ninja; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool already present: $(command -v "$tool")"
            else
              echo "Installing $tool ..."
              brew install "$tool"
            fi
          done

      # WA-2.1 / WA-2.4 — cross-compiles the WHOLE engine (core, nodes, api,
      # backends including CoreAudioBackend.mm, plus the portable DSP) for
      # device + simulator, and link-checks each slice.
      #
      # This is the only job that catches Darwin-vs-bionic breakage (mmap64,
      # off64_t and friends), which the host clang suite above cannot see
      # because it builds for macOS, not iOS. Both slices, because the .mm is
      # the same Objective-C++ on each and the simulator SDK diverges from the
      # device SDK.
      #
      # Used to be two steps — a DSP-only build plus a separate core probe.
      # WA-2.2 and WA-2.4 closed the link gaps that kept the core out of the
      # shipped target, so the probe was promoted and the steps collapsed.
      - name: Build & link-check C++ for iOS (device + simulator) — WA-2.1/2.4
        if: steps.attest.outputs.valid != 'true'
        run: bash scripts/build-ios.sh

      - name: Set up JDK 17
        if: steps.attest.outputs.valid != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Required even though this job builds no Android artifact: the module
      # applies com.android.library, so AGP needs an SDK to configure the
      # project at all — without it Gradle fails before reaching any iOS task.
      - name: Set up Android SDK
        if: steps.attest.outputs.valid != 'true'
        uses: android-actions/setup-android@v4

      # AGP resolves (and silently auto-downloads) the NDK even for iOS-only
      # tasks. Installing it explicitly keeps that ~1 GB download visible in the
      # log and pinned to the catalog version instead of happening implicitly.
      - name: Install NDK and CMake
        if: steps.attest.outputs.valid != 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager --install \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      # The Kotlin/Native toolchain is a ~1 GB download per run otherwise.
      - name: Cache Kotlin/Native toolchain
        if: steps.attest.outputs.valid != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Set up Gradle
        if: steps.attest.outputs.valid != 'true'
        uses: gradle/actions/setup-gradle@v6

      # Since WA-3.1 these also run cinterop, which re-invokes build-ios.sh through
      # the buildIosNativeLib task. That is not wasted work: the CMake tree from the
      # step above is still in the workspace, so ninja reports "no work to do" and
      # the re-run costs seconds. The standalone step stays because it fails BEFORE
      # the JDK/SDK/Gradle setup below, which is the expensive part.
      - name: Compile iOS targets (incl. cinterop) — WA-3.1
        if: steps.attest.outputs.valid != 'true'
        run: ./gradlew :audio:compileKotlinIosArm64 :audio:compileKotlinIosSimulatorArm64

      # The only place the shared Kotlin is executed — not merely compiled — under
      # Kotlin/Native. Since WA-3.1 it also runs CinteropSmokeTest (WA-T.3), which
      # is the only check that the wma_* symbols actually resolve from Kotlin and
      # that each type family survives the boundary.
      - name: Run commonTest + cinterop smoke on iOS simulator — WA-T.3
        if: steps.attest.outputs.valid != 'true'
        run: ./gradlew :audio:iosSimulatorArm64Test

      # WA-4.1. FUERA DEL CAMINO CALIENTE desde 2026-08-05: los dos pasos de
      # abajo NO corren en `pull_request`. La condicion es `!= 'pull_request'` y
      # no `== 'push'` a proposito, para no dejar afuera un `workflow_dispatch`,
      # que hoy si los corre.
      #
      # El XCFramework tiene CERO consumidores y no se distribuye, medido: ni
      # NoisyPad (consume la coordenada Gradle KMP `com.watermellonstudios:audio`
      # y embebe su propio framework con `:ios-shell:embedAndSignAppleFrameworkForXcode`),
      # ni :harness (embebe HarnessKit.framework), ni nadie afuera; y los
      # releases no llevan assets, asi que a Packages sube el artefacto KMP y no
      # esto. Se ensamblaba, se le verificaban los simbolos, y se tiraba.
      #
      # Su justificacion unica era ser "lo unico que prueba que el archivo
      # estatico embebido en el klib resuelve al linkear un binario". Ya no lo
      # es: HarnessKit.framework lleva los MISMOS 253 simbolos wma_*, y encima
      # el harness arranca la app. Lo que queda sin cubrir en el PR es UNA cosa,
      # el link del framework para el slice de DEVICE (ios-arm64) — el simulador
      # lo cubre el harness y el .a de device lo cubre build-ios.sh.
      #
      # Costaba 138 s de los 637 s de este job, y en el gate local era el paso
      # que hizo saltar dos veces el techo global de 45 min (2 s en caliente,
      # 772 s tras un bump de toolchain, 2097 s tras tocar AudioEngine.h).
      #
      # Como corre en CADA push a master, una rotura aparece un merge despues y
      # nunca se convierte en sorpresa de release. `scripts/gate.sh` NO lo corre,
      # y `scripts/test-attestation.sh` tiene el guardian que falla si los dos
      # archivos se separan.
      #
      # `assembleWatermelonXCFramework` es, textual en `gradlew tasks`, "Assemble
      # ALL TYPES of registered 'Watermelon' XCFramework": construye Debug Y
      # Release, o sea cuatro links de framework. Por eso se pide la variante
      # Release, que es la unica que mira el paso de verificacion.
      - name: Assemble XCFramework — WA-4.1
        if: github.event_name != 'pull_request'
        run: ./gradlew :audio:assembleWatermelonReleaseXCFramework

      # Un XCFramework que "se construyo" pero no trae el motor adentro pasaria el
      # paso anterior sin chistar. Esto falla si falta un slice o si los simbolos
      # wma_* no viajaron.
      - name: Verify the XCFramework carries the engine — WA-4.1
        if: github.event_name != 'pull_request'
        run: |
          XCF=audio/build/XCFrameworks/release/Watermelon.xcframework
          for slice in ios-arm64 ios-arm64-simulator; do
            BIN="$XCF/$slice/Watermelon.framework/Watermelon"
            if [ ! -f "$BIN" ]; then
              echo "missing slice: $slice" >&2
              exit 1
            fi
            COUNT="$(nm -gU "$BIN" | grep -c ' T _wma_' || true)"
            echo "$slice: $COUNT wma_* symbols"
            if [ "$COUNT" -lt 100 ]; then
              echo "$slice does not carry the C API — the static archive did not make it in" >&2
              exit 1
            fi
          done

      # Aca solo se ESPERA al simulador. El boot se disparo al principio del job
      # (paso "Start booting a simulator"), asi que sus ~3m30s corrieron en
      # paralelo con el C++, cinterop y el XCFramework en vez de sumarse. El
      # chequeo de arranque de build-harness.sh se saltea con aviso si no hay
      # simulador, y un gate que se saltea siempre no es un gate: es lo UNICO
      # que agarra un Info.plist incompleto —Compose aborta el proceso desde
      # PlistSanityCheck—, asi que la espera es obligatoria y sin `|| true`.
      - name: Wait for the simulator to finish booting — WA-5.5
        if: steps.attest.outputs.valid != 'true'
        run: xcrun simctl bootstatus "$SIM_UDID" -b

      # WA-5.5, mitad iOS. La mitad Android se mudo al job `build` de ubuntu:
      # arrastraba el build NDK de :audio para las 4 ABIs y aca era un build
      # frio a 10x el minuto — 13m56s de un job de 27m.
      #
      # Lo que queda es lo que SOLO puede afirmar macOS: que el framework TRAIGA
      # el motor (distinto de que linkeo, igual que el paso del XCFramework de
      # arriba), que el shell de Xcode compile, y que la app ARRANQUE SIN
      # MORIRSE. Sin este paso el harness se pudre en silencio.
      - name: Build the UI harness, iOS half — WA-5.5
        if: steps.attest.outputs.valid != 'true'
        run: bash scripts/build-harness.sh --ios-only

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # peor medido: 6.4 min
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v7

      # ¿Ya corrió el gate local sobre este contenido exacto? Si sí, los
      # pasos de abajo se saltean y este job termina en verde en segundos.
      # Ante CUALQUIER duda el script emite valid=false y el gate corre
      # entero: es un camino rápido, no una excepción. Ver
      # docs/ci/local_first.md y scripts/verify-attestation.sh.
      - id: attest
        name: Verificar la atestación local
        run: bash scripts/verify-attestation.sh build

      - name: Set up JDK 17
        if: steps.attest.outputs.valid != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        if: steps.attest.outputs.valid != 'true'
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        if: steps.attest.outputs.valid != 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager --install \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        if: steps.attest.outputs.valid != 'true'
        uses: gradle/actions/setup-gradle@v6

      # WA-5.5 — la UI del harness no puede entrar al artefacto publicado.
      # Corre aca y no en el job de macOS porque solo necesita que Gradle
      # configure y resuelva: los minutos de macOS cuestan 10x, y un Compose
      # colado en :audio es igual de rojo dicho por Linux.
      #
      # Va ANTES de los builds: si :audio arrastra UI, lo que se publicaria esta
      # mal aunque compile perfecto.
      - name: UI guardrail — WA-5.5
        if: steps.attest.outputs.valid != 'true'
        run: bash scripts/check-no-ui-in-library.sh

      # REQ-016 — el arnes JNI construye `libwatermelon_audio.{so}` para el HOST
      # (audio/src/main/cpp/tests/hostjni) y la carga desde la JVM de los tests.
      # Necesita un toolchain de C++, y este job NUNCA instalo uno: hasta aca
      # dependia de que la imagen lo trajera sin decirlo en ningun lado.
      #
      # Es el MISMO bloque que `cpp-tests`, con la misma disciplina: no instala
      # nada si la imagen ya los trae (que es el caso hoy), y sin reintentos —
      # ver el comentario largo de aquel paso, que trae la medicion del 18/08.
      # Lo que compra es que un cambio de imagen falle diciendo QUE falta, en vez
      # de un error de CMake adentro de una task de Gradle.
      - name: Install C++ build tools (arnes JNI — REQ-016)
        if: steps.attest.outputs.valid != 'true'
        run: |
          need=""
          command -v cmake >/dev/null 2>&1 || need="$need cmake"
          command -v ninja >/dev/null 2>&1 || need="$need ninja-build"
          command -v g++   >/dev/null 2>&1 || need="$need g++"
          if [ -z "$need" ]; then
            echo "cmake/ninja/g++ ya vienen en la imagen — nada que instalar"
            cmake --version | head -1; ninja --version; g++ --version | head -1
            exit 0
          fi
          echo "falta instalar:$need"
          sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 update
          sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 \
            install -y $need

      # El nombre decia solo `commonTest` y ya no es cierto: esta task tambien
      # corre el arnes JNI de REQ-016, que EJECUTA funciones JNIEXPORT reales
      # contra un JNIEnv real. No hay un paso aparte a proposito (D3): es un
      # test, no un lint, y vive donde viven los tests.
      - name: Kotlin unit tests (commonTest) + arnes JNI (REQ-016)
        if: steps.attest.outputs.valid != 'true'
        run: ./gradlew :audio:testDebugUnitTest

      - name: Build debug
        if: steps.attest.outputs.valid != 'true'
        run: ./gradlew :audio:assembleDebug

      # WA-5.5 — la mitad Android del harness vive aca y no en el job de macOS.
      # `:harness:assembleDebug` arrastra el build NDK de :audio para las 4 ABIs;
      # aca eso ya lo hizo `Build debug` una linea mas arriba, asi que el paso
      # cuesta el Kotlin/Compose y el empaquetado y nada mas. En el runner de
      # macOS era un build frio a 10x el precio del minuto y se comia la mitad
      # del job de iOS (13m56s de 27m). No se pierde cobertura: lo que la mitad
      # Android afirma —que el harness sigue compilando para Android— lo dice
      # igual de rojo Linux. Lo que SOLO puede decir macOS (que el framework
      # traiga el motor, que el shell de Xcode compile, que la app arranque)
      # sigue en el job de iOS con --ios-only.
      - name: Build the UI harness, Android half — WA-5.5
        if: steps.attest.outputs.valid != 'true'
        run: bash scripts/build-harness.sh --android-only

      - name: Build release
        if: steps.attest.outputs.valid != 'true'
        run: ./gradlew :audio:assembleRelease

      # MINI-001 — toda `external fun` del bridge tiene su simbolo JNI en el .so.
      # Un nombre que no coincide compila limpio de los DOS lados y falla en
      # runtime, en el device. Va aca y no entre los lints porque necesita el
      # .so que acaba de dejar el paso de arriba. El self-test primero: un
      # chequeo que no sabe fallar da verde para siempre.
      - name: JNI symbols — self-test
        if: steps.attest.outputs.valid != 'true'
        run: python3 scripts/check-jni-symbols.py --self-test

      - name: JNI symbols — declaradas vs exportadas
        if: steps.attest.outputs.valid != 'true'
        run: python3 scripts/check-jni-symbols.py
