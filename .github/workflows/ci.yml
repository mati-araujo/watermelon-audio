name: CI

on:
  pull_request:
    branches: [master]
    # Un PR que SÓLO toca prosa no compila nada distinto, y hasta acá corría los
    # cinco jobs igual — incluidos ~20 min de macOS, que cuesta 10x. De los 20
    # commits previos a este cambio, NUEVE eran `docs(kmp):` o `chore: release`.
    # El caso extremo fue el PR #75: un archivo, `CHANGELOG.md`, cinco jobs, y
    # encima flakeó el de iOS.
    #
    # `paths-ignore` saltea sólo si TODOS los archivos del PR machean, así que un
    # PR que mezcla código y docs sigue corriendo entero. Es lo que se quiere.
    #
    # OJO SI ALGÚN DÍA SE MARCAN ESTOS CHECKS COMO *REQUIRED*: un job salteado
    # queda `pending` para siempre y bloquea el merge. Ahí hay que cambiar a
    # `dorny/paths-filter` con un job "dummy" que reporte pass, no a esto.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast host C++ unit tests (dsp + effects + looper + usb) via googletest.
  # No Android SDK / NDK / device needed — pure x86_64. Single configure +
  # build + ctest pass driven by scripts/run-cpp-tests.sh.
  cpp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # WA-0.4 — pure grep, no toolchain. Runs here rather than in the `ios`
      # job on purpose: macOS minutes cost 10x, and a forbidden include is just
      # as red when Linux says so.
      - name: Portability guardrail (WA-0.4)
        run: bash scripts/check-cpp-portability.sh

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++

      - name: Build & run C++ test suite
        run: bash scripts/run-cpp-tests.sh

  # Same suite under AddressSanitizer + UndefinedBehaviorSanitizer. Catches
  # heap/stack overflows, use-after-free and UB in the lock-free rings and the
  # teardown path — the highest-risk code as the driver plan gains new logic.
  cpp-tests-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++
      - name: Build & run C++ test suite (ASan+UBSan)
        env:
          SANITIZE: address,undefined
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: bash scripts/run-cpp-tests.sh

  # Same suite under ThreadSanitizer. The SPSC rings and the DSP↔USB↔event
  # handoff are the #1 candidates for latent data races.
  cpp-tests-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++
      - name: Build & run C++ test suite (TSan)
        env:
          SANITIZE: thread
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: bash scripts/run-cpp-tests.sh

  # WA-0.3 — macOS / iOS job.
  #
  # Two things no other job can catch:
  #   1. The C++ suite under Apple clang (WA-T.1) — the ubuntu jobs use g++ and
  #      the Windows wrapper uses MinGW, so clang-apple diagnostics only surface
  #      here. This is the early-warning system for the iOS C++ build (WA-2.1).
  #   2. That commonMain still compiles for Kotlin/Native. commonMain is only
  #      ever type-checked against the JVM classpath elsewhere, which is exactly
  #      how it silently accumulated 34 JVM-only references before WA-0.2
  #      (String.format, System.currentTimeMillis, @Volatile, java.* reflection).
  #      Without this job that debt comes straight back.
  #
  # Must stay on an arm64 runner: iosSimulatorArm64 tests cannot execute on x86.
  ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      # El boot del simulador tarda ~3m30s y NO depende de nada de lo que sigue,
      # asi que se dispara primero y se espera recien al final (paso "Wait for
      # the simulator"). Antes era un paso bloqueante justo antes del harness y
      # esos 3m30s se sumaban enteros al job.
      #
      # `simctl boot` vuelve enseguida —el arranque sigue de fondo— y el UDID se
      # publica en el env para el paso que espera. Si no hubiera ningun iPhone
      # disponible, esto falla ACA y no veinte minutos despues.
      - name: Start booting a simulator — WA-5.5
        run: |
          UDID="$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for v in d.values() for x in v if "iPhone" in x["name"]))')"
          xcrun simctl boot "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      # C++ first: it needs no JDK/SDK/Gradle, so a portability break fails
      # before we pay for the toolchain setup below.
      # The runner image normally ships both; install only what is missing so a
      # future image change cannot break this job, and a normal run costs ~0s.
      # Note this needs a system cmake — the "cmake;3.22.1" installed into the
      # Android SDK further down is not on PATH and is for AGP, not for this.
      - name: Install C++ build tools
        run: |
          for tool in cmake ninja; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool already present: $(command -v "$tool")"
            else
              echo "Installing $tool ..."
              brew install "$tool"
            fi
          done

      - name: Build & run C++ test suite (Apple clang) — WA-T.1
        run: bash scripts/run-cpp-tests.sh

      # WA-2.1 / WA-2.4 — cross-compiles the WHOLE engine (core, nodes, api,
      # backends including CoreAudioBackend.mm, plus the portable DSP) for
      # device + simulator, and link-checks each slice.
      #
      # This is the only job that catches Darwin-vs-bionic breakage (mmap64,
      # off64_t and friends), which the host clang suite above cannot see
      # because it builds for macOS, not iOS. Both slices, because the .mm is
      # the same Objective-C++ on each and the simulator SDK diverges from the
      # device SDK.
      #
      # Used to be two steps — a DSP-only build plus a separate core probe.
      # WA-2.2 and WA-2.4 closed the link gaps that kept the core out of the
      # shipped target, so the probe was promoted and the steps collapsed.
      - name: Build & link-check C++ for iOS (device + simulator) — WA-2.1/2.4
        run: bash scripts/build-ios.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Required even though this job builds no Android artifact: the module
      # applies com.android.library, so AGP needs an SDK to configure the
      # project at all — without it Gradle fails before reaching any iOS task.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # AGP resolves (and silently auto-downloads) the NDK even for iOS-only
      # tasks. Installing it explicitly keeps that ~1 GB download visible in the
      # log and pinned to the catalog version instead of happening implicitly.
      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager --install \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      # The Kotlin/Native toolchain is a ~1 GB download per run otherwise.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Since WA-3.1 these also run cinterop, which re-invokes build-ios.sh through
      # the buildIosNativeLib task. That is not wasted work: the CMake tree from the
      # step above is still in the workspace, so ninja reports "no work to do" and
      # the re-run costs seconds. The standalone step stays because it fails BEFORE
      # the JDK/SDK/Gradle setup below, which is the expensive part.
      - name: Compile iOS targets (incl. cinterop) — WA-3.1
        run: ./gradlew :audio:compileKotlinIosArm64 :audio:compileKotlinIosSimulatorArm64

      # The only place the shared Kotlin is executed — not merely compiled — under
      # Kotlin/Native. Since WA-3.1 it also runs CinteropSmokeTest (WA-T.3), which
      # is the only check that the wma_* symbols actually resolve from Kotlin and
      # that each type family survives the boundary.
      - name: Run commonTest + cinterop smoke on iOS simulator — WA-T.3
        run: ./gradlew :audio:iosSimulatorArm64Test

      # WA-4.1. Linkea de verdad ambos slices y los empaqueta, que es lo unico que
      # prueba que el archivo estatico embebido en el klib resuelve al linkear un
      # binario — el link check de build-ios.sh valida el archivo, no el framework.
      - name: Assemble XCFramework — WA-4.1
        run: ./gradlew :audio:assembleWatermelonXCFramework

      # Un XCFramework que "se construyo" pero no trae el motor adentro pasaria el
      # paso anterior sin chistar. Esto falla si falta un slice o si los simbolos
      # wma_* no viajaron.
      - name: Verify the XCFramework carries the engine — WA-4.1
        run: |
          XCF=audio/build/XCFrameworks/release/Watermelon.xcframework
          for slice in ios-arm64 ios-arm64-simulator; do
            BIN="$XCF/$slice/Watermelon.framework/Watermelon"
            if [ ! -f "$BIN" ]; then
              echo "missing slice: $slice" >&2
              exit 1
            fi
            COUNT="$(nm -gU "$BIN" | grep -c ' T _wma_' || true)"
            echo "$slice: $COUNT wma_* symbols"
            if [ "$COUNT" -lt 100 ]; then
              echo "$slice does not carry the C API — the static archive did not make it in" >&2
              exit 1
            fi
          done

      # Aca solo se ESPERA al simulador. El boot se disparo al principio del job
      # (paso "Start booting a simulator"), asi que sus ~3m30s corrieron en
      # paralelo con el C++, cinterop y el XCFramework en vez de sumarse. El
      # chequeo de arranque de build-harness.sh se saltea con aviso si no hay
      # simulador, y un gate que se saltea siempre no es un gate: es lo UNICO
      # que agarra un Info.plist incompleto —Compose aborta el proceso desde
      # PlistSanityCheck—, asi que la espera es obligatoria y sin `|| true`.
      - name: Wait for the simulator to finish booting — WA-5.5
        run: xcrun simctl bootstatus "$SIM_UDID" -b

      # WA-5.5, mitad iOS. La mitad Android se mudo al job `build` de ubuntu:
      # arrastraba el build NDK de :audio para las 4 ABIs y aca era un build
      # frio a 10x el minuto — 13m56s de un job de 27m.
      #
      # Lo que queda es lo que SOLO puede afirmar macOS: que el framework TRAIGA
      # el motor (distinto de que linkeo, igual que el paso del XCFramework de
      # arriba), que el shell de Xcode compile, y que la app ARRANQUE SIN
      # MORIRSE. Sin este paso el harness se pudre en silencio.
      - name: Build the UI harness, iOS half — WA-5.5
        run: bash scripts/build-harness.sh --ios-only

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager --install \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # WA-5.5 — la UI del harness no puede entrar al artefacto publicado.
      # Corre aca y no en el job de macOS porque solo necesita que Gradle
      # configure y resuelva: los minutos de macOS cuestan 10x, y un Compose
      # colado en :audio es igual de rojo dicho por Linux.
      #
      # Va ANTES de los builds: si :audio arrastra UI, lo que se publicaria esta
      # mal aunque compile perfecto.
      - name: UI guardrail — WA-5.5
        run: bash scripts/check-no-ui-in-library.sh

      - name: Kotlin unit tests (commonTest)
        run: ./gradlew :audio:testDebugUnitTest

      - name: Build debug
        run: ./gradlew :audio:assembleDebug

      # WA-5.5 — la mitad Android del harness vive aca y no en el job de macOS.
      # `:harness:assembleDebug` arrastra el build NDK de :audio para las 4 ABIs;
      # aca eso ya lo hizo `Build debug` una linea mas arriba, asi que el paso
      # cuesta el Kotlin/Compose y el empaquetado y nada mas. En el runner de
      # macOS era un build frio a 10x el precio del minuto y se comia la mitad
      # del job de iOS (13m56s de 27m). No se pierde cobertura: lo que la mitad
      # Android afirma —que el harness sigue compilando para Android— lo dice
      # igual de rojo Linux. Lo que SOLO puede decir macOS (que el framework
      # traiga el motor, que el shell de Xcode compile, que la app arranque)
      # sigue en el job de iOS con --ios-only.
      - name: Build the UI harness, Android half — WA-5.5
        run: bash scripts/build-harness.sh --android-only

      - name: Build release
        run: ./gradlew :audio:assembleRelease
