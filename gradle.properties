# Performance
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Library version. Release Please updates this block.
# x-release-please-start-version
version=2.8.2
# x-release-please-end

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Temporary AGP 9.x bridge while this module still needs com.android.library
# for externalNativeBuild/CMake. The recommended replacement plugin
# (com.android.kotlin.multiplatform.library) still does NOT expose the native
# build DSL — externalNativeBuild/CMake, ndk abiFilters, prefab — that this
# audio module is built around (verified against AGP 9.2.x; see
# https://developer.android.com/kotlin/multiplatform/plugin).
#
# Migrating would mean splitting this into a native-only com.android.library
# module + a KMP library module that consumes it. Deferred until then.
#
# In AGP 9 the defaults for both flipped false->true. We opt OUT (=false) on
# purpose: builtInKotlin=false stops AGP from applying its own Kotlin (which
# would clash with the KMP plugin), and newDsl=false keeps the legacy
# LibraryExtension DSL that KmpNativeConventionPlugin drives (externalNativeBuild,
# buildFeatures, ...). These opt-outs are REQUIRED on this path — do not remove
# them without a full local build check.
#
# HARD DEADLINE: the com.android.library + KMP compatibility APIs (and these
# opt-out flags) are removed in AGP 10.0 (H2 2026). Before adopting AGP 10 this
# module must be split as above.
#
# EXPECTED, UN-SUPPRESSABLE build warnings until that split (all same root cause,
# AGP provides no flag for these — unlike the KMP nowarn flag below):
#   - "option setting 'android.builtInKotlin=false' is deprecated"
#   - "option setting 'android.newDsl=false' is deprecated"
#   - "API 'libraryVariants'/'testVariants'/'unitTestVariants' is obsolete"
#     (emitted by the KMP plugin internals, not our build scripts)
# Do not chase these individually — they clear only when off com.android.library.
android.builtInKotlin=false
android.newDsl=false

# Silence the KMP<->AGP compatibility deprecation warning
# ("org.jetbrains.kotlin.multiplatform ... deprecated compatibility with
# 'com.android.library'"). We knowingly stay on com.android.library for the
# native-build reasons above. Documented flag — see KT-82050.
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true

# Make the cinterop bindings visible to SHARED source sets, not just to the
# platform compilations.
#
# Without this, cinterop klibs reach iosArm64 and iosSimulatorArm64 but not the
# `iosMain` metadata compilation — so IosAudioBridge.kt, which lives in iosMain
# and is written against the generated wma_* bindings, compiles fine per-target
# and fails in `compileIosMainKotlinMetadata` with 109 unresolved references.
#
# That task is not in our gate set, so the break was invisible here and only
# surfaced when a KMP consumer with iOS targets (NoisyPad's core-domain) pulled
# the metadata compilation. It blocks G1.
kotlin.mpp.enableCInteropCommonization=true
