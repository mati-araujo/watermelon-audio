# Performance
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Temporary AGP 9.x bridge while this module still needs com.android.library
# for externalNativeBuild/CMake. The recommended replacement plugin currently
# does not expose the native build DSL this audio module depends on.
android.builtInKotlin=false
android.newDsl=false
